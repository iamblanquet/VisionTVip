name: Build VisionTV APK & Publish Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compilar APK y Publicar Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Extract Version from app/build.gradle.kts
        id: extract_version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Detected VisionTV version: v$VERSION_NAME (code $VERSION_CODE)"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare Release APK Files
        run: |
          cp app/build/outputs/apk/release/app-release.apk "VisionTV_v${{ steps.extract_version.outputs.version_name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "DahuaTvViewer.apk"
          ls -lh "VisionTV_v${{ steps.extract_version.outputs.version_name }}.apk" "DahuaTvViewer.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionTV-v${{ steps.extract_version.outputs.version_name }}-APK
          path: |
            VisionTV_v${{ steps.extract_version.outputs.version_name }}.apk
            DahuaTvViewer.apk

      - name: Create or Update GitHub Release (OTA Update)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.extract_version.outputs.version_name }}
          name: "VisionTV v${{ steps.extract_version.outputs.version_name }} (Android TV)"
          body: |
            ### 📺 Actualización Oficial VisionTV v${{ steps.extract_version.outputs.version_name }} (Build #${{ steps.extract_version.outputs.version_code }})
            - APK compilado y firmado automáticamente mediante GitHub Actions.
            - Disponible para actualización directa (OTA) desde la aplicación **VisionTV** en Android TV.
          files: |
            VisionTV_v${{ steps.extract_version.outputs.version_name }}.apk
            DahuaTvViewer.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
